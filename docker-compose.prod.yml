services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sellmoreofyour_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate-db:
    image: sellmoreofyour-backend-prod
    build:
      context: ./backend
      target: prod
    environment:
      SOURCE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - ./:/data
    command: ["node", "dist/migratePostgres.js"]
    restart: "no"

  backend:
    image: sellmoreofyour-backend-prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: sqlite:/data/db.sqlite3
      REDIS_URL: redis://redis:6379
      GENERATION_TIMEZONE: ${GENERATION_TIMEZONE:-Europe/Sofia}
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./:/data
    command: ["sh", "scripts/run-as-data-owner.sh", "node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: sellmoreofyour-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    image: sellmoreofyour-backend-prod
    env_file:
      - path: backend/.env.production
        required: false
    environment:
      DATABASE_URL: sqlite:/data/db.sqlite3
      LOCAL_SUPERADMIN_EMAIL: ${LOCAL_SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${LOCAL_SUPERADMIN_PASSWORD}
    volumes:
      - ./:/data
    command: ["sh", "scripts/run-as-data-owner.sh", "node", "scripts/create-superadmin.mjs"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  sellmoreofyour_prod_postgres_data:
